<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0e1330" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Arena dos Monstrinhos Online</title>
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Monstrinhos" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta
      name="description"
      content="Batalha de monstrinhos online para jogar com a família, cada um no seu celular."
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        font-family: Fredoka, system-ui, sans-serif;
        background: radial-gradient(circle at 50% 0, #2b3a8c, #0e1330 70%) fixed;
        color: #fff;
        min-height: 100vh;
      }
      #app {
        max-width: 480px;
        margin: 0 auto;
        padding: 12px 12px 50px;
      }
      h1 {
        font-size: 34px;
        text-align: center;
        margin: 14px 0 2px;
      }
      h2 {
        margin: 6px 0;
      }
      .sub {
        text-align: center;
        opacity: 0.85;
        margin: 0 0 16px;
      }
      label {
        display: block;
        margin: 10px 0;
        font-weight: 600;
      }
      input {
        width: 100%;
        font: inherit;
        font-size: 17px;
        padding: 10px;
        border-radius: 12px;
        border: 2px solid #3d4aa0;
        background: #141b45;
        color: #fff;
        margin-top: 4px;
      }
      .btn {
        display: block;
        width: 100%;
        font: inherit;
        font-weight: 700;
        font-size: 19px;
        padding: 14px;
        border: 0;
        border-radius: 16px;
        background: #ffcb05;
        color: #1a1a40;
        margin: 10px 0;
        box-shadow: 0 4px 0 #b8920a;
      }
      .btn:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 #b8920a;
      }
      .btn:disabled {
        opacity: 0.4;
      }
      .btn.sec {
        background: #3d4aa0;
        color: #fff;
        box-shadow: 0 4px 0 #232c6b;
      }
      .btn.red {
        background: #e53935;
        color: #fff;
        box-shadow: 0 4px 0 #8e1c1a;
      }
      .btn.sm {
        font-size: 15px;
        padding: 11px;
        margin: 6px 0;
      }
      .small {
        font-size: 13px;
        opacity: 0.85;
      }
      .mini {
        font: inherit;
        font-weight: 600;
        font-size: 14px;
        padding: 7px 10px;
        border-radius: 10px;
        border: 0;
        background: rgba(0, 0, 0, 0.35);
        color: #fff;
      }
      .hdr {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .turn {
        font-size: 23px;
        font-weight: 700;
        color: #ffcb05;
      }
      .mon {
        display: flex;
        gap: 10px;
        align-items: center;
        background: linear-gradient(135deg, var(--tc), #1b2150 80%);
        border-radius: 20px;
        padding: 10px 12px;
        border: 3px solid rgba(255, 255, 255, 0.25);
        margin: 6px 0;
      }
      .em {
        width: 92px;
        height: 92px;
        flex: 0 0 92px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 40% 35%,
          rgba(255, 255, 255, 0.55),
          rgba(255, 255, 255, 0.08)
        );
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 58px;
        animation: bob 2.4s ease-in-out infinite;
      }
      .mon.me .em {
        width: 110px;
        height: 110px;
        flex-basis: 110px;
        font-size: 72px;
      }
      @keyframes bob {
        50% {
          transform: translateY(-5px);
        }
      }
      .info {
        flex: 1;
        min-width: 0;
      }
      .top {
        display: flex;
        justify-content: space-between;
        font-size: 19px;
        font-weight: 700;
      }
      .bar {
        height: 13px;
        background: rgba(0, 0, 0, 0.4);
        border-radius: 8px;
        overflow: hidden;
        margin: 6px 0;
      }
      .bar i {
        display: block;
        height: 100%;
        background: #4cdd6a;
        transition: width 0.8s;
      }
      .bar i.mid {
        background: #ffcb05;
      }
      .bar i.low {
        background: #ff4d4d;
      }
      .badge {
        display: inline-block;
        background: #fff;
        color: #1a1a40;
        border-radius: 8px;
        padding: 1px 7px;
        font-size: 13px;
        font-weight: 700;
        margin: 3px 3px 0 0;
      }
      .vs {
        text-align: center;
        font-weight: 700;
        opacity: 0.6;
        margin: 0;
      }
      .atk {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        width: 100%;
        font: inherit;
        text-align: left;
        padding: 10px 14px;
        margin: 7px 0;
        border-radius: 14px;
        border: 0;
        background: #fff;
        color: #1a1a40;
        font-size: 17px;
        font-weight: 700;
        box-shadow: 0 4px 0 #8890b0;
      }
      .atk:disabled {
        opacity: 0.45;
      }
      .atk .d {
        font-size: 26px;
      }
      .atk .small {
        opacity: 0.75;
        font-weight: 600;
      }
      .lbl {
        font-size: 13px;
        opacity: 0.75;
        margin: 10px 0 2px;
        font-weight: 600;
      }
      .hand,
      .bench {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 4px 0 6px;
      }
      .hc {
        flex: 0 0 78px;
        font: inherit;
        padding: 8px 4px;
        border-radius: 14px;
        border: 0;
        background: linear-gradient(180deg, #fff, #dfe4ff);
        color: #1a1a40;
        font-size: 12px;
        font-weight: 700;
        box-shadow: 0 3px 0 #8890b0;
      }
      .hc b {
        display: block;
        font-size: 30px;
      }
      .hc:disabled {
        opacity: 0.4;
      }
      .bc {
        flex: 0 0 auto;
        font: inherit;
        padding: 6px 10px;
        border-radius: 14px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        background: #141b45;
        color: #fff;
        font-size: 13px;
        text-align: center;
      }
      .bc b {
        display: block;
        font-size: 30px;
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .pick {
        position: relative;
        font: inherit;
        color: #fff;
        text-align: left;
        border: 3px solid transparent;
        border-radius: 16px;
        padding: 8px;
        background: linear-gradient(160deg, var(--tc), #1b2150 90%);
      }
      .pick.on {
        border-color: #ffcb05;
        box-shadow: 0 0 0 3px rgba(255, 203, 5, 0.35);
      }
      .pick .e {
        font-size: 44px;
        text-align: center;
      }
      .pick .n {
        font-weight: 700;
        font-size: 16px;
      }
      .pick .num {
        position: absolute;
        top: 6px;
        right: 8px;
        background: #ffcb05;
        color: #1a1a40;
        border-radius: 50%;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
      }
      .ov {
        position: fixed;
        inset: 0;
        background: rgba(5, 8, 25, 0.85);
        display: flex;
        align-items: flex-end;
        justify-content: center;
        z-index: 9;
      }
      .md {
        background: #1b2150;
        width: 100%;
        max-width: 480px;
        max-height: 92vh;
        overflow: auto;
        border-radius: 22px 22px 0 0;
        padding: 18px 16px 28px;
      }
      .big {
        font-size: 60px;
        text-align: center;
        font-weight: 700;
      }
      .coin {
        width: 140px;
        height: 140px;
        margin: 16px auto;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #ffe680, #d4a000);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        font-weight: 700;
        color: #5a4300;
        animation: flip 1s ease-out;
        box-shadow: 0 6px 0 #8a6800;
      }
      @keyframes flip {
        0% {
          transform: rotateY(0) scale(0.6);
        }
        100% {
          transform: rotateY(1800deg) scale(1);
        }
      }
      .reveal {
        animation: fade 0.4s 1s both;
      }
      .reveal2 {
        animation: fade 0.4s 1.3s both;
      }
      @keyframes fade {
        from {
          opacity: 0;
          transform: scale(0.7);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .pop {
        animation: pop 0.6s both;
      }
      @keyframes pop {
        0% {
          transform: scale(0.3);
          opacity: 0;
        }
        60% {
          transform: scale(1.2);
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      .fight {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 76px;
        padding: 10px 20px;
        height: 120px;
      }
      .lunge {
        animation: lunge 0.7s ease-in-out;
      }
      @keyframes lunge {
        40% {
          transform: translateX(90px) scale(1.15);
        }
        100% {
          transform: none;
        }
      }
      .hit {
        animation: hit 0.5s 0.3s;
      }
      @keyframes hit {
        0%,
        100% {
          transform: none;
          filter: none;
        }
        25% {
          transform: translateX(-10px) rotate(-8deg);
          filter: brightness(2);
        }
        75% {
          transform: translateX(10px) rotate(8deg);
        }
      }
      .ko {
        animation: ko 0.8s 0.6s forwards;
      }
      @keyframes ko {
        to {
          transform: rotate(90deg) translateY(30px);
          opacity: 0.2;
        }
      }
      .dmg {
        color: #ff5252;
        animation: pop 0.5s 0.5s both;
      }
      .msg {
        background: #141b45;
        border-radius: 12px;
        padding: 10px 12px;
        margin: 6px 0;
      }
      .toast {
        background: #ffcb05;
        color: #1a1a40;
        font-weight: 700;
        border-radius: 12px;
        padding: 8px 12px;
        margin: 6px 0;
        animation: pop 0.4s;
      }
      details {
        background: #141b45;
        border-radius: 14px;
        padding: 10px 14px;
        margin-top: 14px;
      }
      summary {
        font-weight: 700;
      }
      details li {
        margin: 6px 0;
      }
      .it {
        display: flex;
        gap: 8px;
        align-items: center;
        margin: 6px 0;
      }
      .pl {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 10px;
        font: inherit;
        color: #fff;
        text-align: left;
        background: #141b45;
        border: 3px solid transparent;
        border-radius: 14px;
        padding: 8px 12px;
      }
      .pl.on {
        border-color: #ffcb05;
        box-shadow: 0 0 0 3px rgba(255, 203, 5, 0.3);
      }
      .av {
        font-size: 34px;
      }
      .f {
        flex: 1;
        min-width: 0;
      }
      .num2 {
        background: #ffcb05;
        color: #1a1a40;
        border-radius: 10px;
        padding: 2px 8px;
        font-weight: 700;
      }
      .rk {
        display: flex;
        align-items: center;
        gap: 10px;
        background: #141b45;
        border-radius: 14px;
        padding: 10px 12px;
        margin: 6px 0;
      }
      .rk:first-of-type {
        background: linear-gradient(90deg, #6b5200, #141b45);
      }
      .pos {
        font-size: 28px;
        width: 40px;
        text-align: center;
        font-weight: 700;
      }
      .wins {
        font-size: 30px;
        font-weight: 700;
        color: #ffcb05;
      }
      .avs {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .avb {
        font-size: 30px;
        background: #141b45;
        border: 3px solid transparent;
        border-radius: 12px;
        padding: 4px 6px;
      }
      .avb.on {
        border-color: #ffcb05;
      }

      body {
        background:
          radial-gradient(1100px 600px at 50% -15%, #3b4fc0 0, transparent 60%),
          radial-gradient(
            700px 500px at 105% 105%,
            rgba(142, 63, 184, 0.35),
            transparent 60%
          ),
          radial-gradient(
            600px 400px at -5% 80%,
            rgba(30, 127, 214, 0.25),
            transparent 60%
          ),
          #0b1030;
        background-attachment: fixed;
      }
      .narrow {
        max-width: 520px;
        margin: 0 auto;
      }
      .badge.good {
        background: #4cdd6a;
      }
      .hc,
      .pick,
      .atk,
      .bc,
      .btn {
        transition:
          transform 0.15s,
          filter 0.15s;
      }
      .mon {
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      .pick {
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
      }
      @media (hover: hover) {
        button {
          cursor: pointer;
        }
        .btn:not(:disabled):hover,
        .atk:not(:disabled):hover,
        .hc:not(:disabled):hover,
        .pick:not(:disabled):hover,
        .bc:not(:disabled):hover {
          filter: brightness(1.12);
          transform: translateY(-2px);
        }
      }
      @media (min-width: 640px) {
        .grid2.picks {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      @media (min-width: 900px) {
        #app {
          max-width: 1180px;
          padding: 26px 30px 60px;
        }
        .grid2.picks {
          grid-template-columns: repeat(4, 1fr);
          gap: 14px;
        }
        .pick .e {
          font-size: 56px;
        }
        .bt {
          display: grid;
          grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
          gap: 28px;
          align-items: start;
        }
        .side {
          position: sticky;
          top: 18px;
          background: rgba(20, 27, 69, 0.65);
          border: 1px solid rgba(255, 255, 255, 0.08);
          border-radius: 22px;
          padding: 16px 18px;
          backdrop-filter: blur(6px);
        }
        .hand,
        .bench {
          flex-wrap: wrap;
          overflow: visible;
        }
        .hc {
          flex: 0 0 92px;
          font-size: 13px;
          padding: 10px 4px;
        }
        .hc b {
          font-size: 38px;
        }
        .mon {
          padding: 16px 20px;
          border-radius: 24px;
        }
        .em {
          width: 120px;
          height: 120px;
          flex-basis: 120px;
          font-size: 76px;
        }
        .mon.me .em {
          width: 150px;
          height: 150px;
          flex-basis: 150px;
          font-size: 98px;
        }
        .top {
          font-size: 24px;
        }
        .small {
          font-size: 14px;
        }
        .atk {
          font-size: 19px;
          padding: 14px 18px;
        }
        .vs {
          font-size: 22px;
        }
        .turn {
          font-size: 30px;
        }
        h1 {
          font-size: 46px;
        }
        .hdr {
          margin-bottom: 12px;
          padding-bottom: 10px;
          border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .ov {
          align-items: center;
        }
        .md {
          border-radius: 24px;
          max-width: 520px;
          padding: 24px;
        }
      }
      .pick.lg {
        border-color: #ffd54a;
        background: linear-gradient(160deg, var(--tc), #3a2a00 95%);
        box-shadow: 0 0 18px rgba(255, 213, 74, 0.45);
      }
      .pick.lg.on {
        border-color: #fff;
      }
      .lgtag {
        position: absolute;
        top: 6px;
        left: 8px;
        background: linear-gradient(90deg, #ffd54a, #ff9f1a);
        color: #3a2a00;
        font-size: 11px;
        font-weight: 700;
        border-radius: 8px;
        padding: 2px 7px;
      }
      .mon.lg {
        border-color: #ffd54a;
        box-shadow:
          0 0 24px rgba(255, 213, 74, 0.4),
          0 10px 30px rgba(0, 0, 0, 0.35);
      }
      .mon.lg .em {
        background: radial-gradient(
          circle at 40% 35%,
          rgba(255, 235, 150, 0.8),
          rgba(255, 180, 0, 0.15)
        );
      }
      .sharebox {
        background: #141b45;
        border-radius: 16px;
        padding: 12px 14px;
        margin: 10px 0;
        text-align: center;
      }
      .sharebox .code {
        font-size: 52px;
        font-weight: 700;
        letter-spacing: 8px;
        color: #ffcb05;
        line-height: 1.1;
      }
      .queue {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 6px;
      }
      .qi {
        display: flex;
        align-items: center;
        gap: 8px;
        background: #141b45;
        border-radius: 12px;
        padding: 6px 10px;
      }
      .qi.me {
        outline: 2px solid #ffcb05;
      }
      .qi.off {
        opacity: 0.5;
      }
      .qi .av {
        font-size: 24px;
      }
      .qn {
        width: 22px;
        text-align: center;
        font-weight: 700;
        opacity: 0.7;
      }
      .reacts {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .rb {
        font-size: 26px;
        background: #141b45;
        border: 0;
        border-radius: 12px;
        padding: 6px 10px;
      }
      .rb:active {
        transform: scale(1.3);
      }
      .react {
        position: fixed;
        bottom: 80px;
        z-index: 20;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: floatup 2.6s ease-out forwards;
      }
      .react b {
        font-size: 46px;
      }
      .react span {
        font-size: 12px;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 8px;
        padding: 1px 6px;
      }
      @keyframes floatup {
        0% {
          transform: translateY(0) scale(0.5);
          opacity: 0;
        }
        15% {
          transform: translateY(-30px) scale(1.2);
          opacity: 1;
        }
        100% {
          transform: translateY(-320px) scale(1);
          opacity: 0;
        }
      }
      .watch {
        background: linear-gradient(90deg, #3d4aa0, #141b45);
        border-radius: 14px;
        padding: 10px 14px;
        margin: 6px 0 10px;
        font-size: 15px;
      }
      .enbar {
        background: #141b45;
        border-radius: 12px;
        padding: 8px 12px;
        margin: 6px 0;
        font-size: 15px;
      }
      .enbar.full {
        background: #1f4d2b;
      }
      .pair {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .mc {
        display: flex;
        gap: 8px;
        align-items: center;
        background: linear-gradient(135deg, var(--tc), #1b2150 85%);
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 14px;
        padding: 6px 8px;
        min-width: 0;
        text-align: left;
        color: #fff;
      }
      .mc .me {
        width: 44px;
        height: 44px;
        flex: 0 0 44px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 40% 35%,
          rgba(255, 255, 255, 0.55),
          rgba(255, 255, 255, 0.08)
        );
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
      }
      .mc .mi {
        flex: 1;
        min-width: 0;
      }
      .mc .mt {
        display: flex;
        justify-content: space-between;
        gap: 4px;
        font-size: 14px;
      }
      .mc .mt b {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .mc .bar {
        height: 8px;
        margin: 3px 0;
      }
      .mc .small {
        font-size: 12px;
      }
      .mc .badge {
        font-size: 11px;
        padding: 0 5px;
      }
      .mc.big {
        flex-direction: column;
        text-align: center;
        padding: 10px 8px;
        border-radius: 18px;
      }
      .mc.big .me {
        width: 82px;
        height: 82px;
        flex-basis: 82px;
        font-size: 54px;
        animation: bob 2.4s ease-in-out infinite;
      }
      .mc.big .mi {
        width: 100%;
      }
      .mc.big .mt {
        font-size: 17px;
      }
      .mc.big .small {
        font-size: 13px;
      }
      .mc.lg {
        border-color: #ffd54a;
        box-shadow: 0 0 14px rgba(255, 213, 74, 0.4);
      }
      .mc.done {
        opacity: 0.7;
      }
      .mc.weak {
        outline: 3px solid #ff5252;
      }
      .mc.empty {
        justify-content: center;
        opacity: 0.5;
        min-height: 58px;
        background: #141b45;
      }
      .opps {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .opp {

          mc.dmg = Math.max(0, mc.dmg - 30);
          clearBad(mc);
          notes.push(`✨ ${r.n} curou 30 e ficou limpinho!`);
        }
        if (at.fx === "heal20" && mc.dmg) {
          mc.dmg = Math.max(0, mc.dmg - 20);
          notes.push(`💚 ${r.n} curou 20.`);
        }
        if (at.fx === "charge") {
          mc.en++;
          notes.push(`🟡 ${r.n} ganhou +1 energia!`);
        }
        if (at.fx === "drawcard") {
          const dc = draw(p);
          notes.push(dc ? `🃏 ${p.name} comprou uma carta` : "🃏 Mão cheia.");
        }
        if (at.fx === "bench10") {
          const bb = bench(o);
          for (const b of bb) {
            b.dmg += 10;
            if (b.dmg >= R[b.k].hp) notes.push(knock(tgt, b));
          }
          if (bb.length) notes.push(`💫 Banco de ${o.name} levou 10 cada!`);
        }
        if (at.fx === "self20") {
          mc.dmg += 20;
          notes.push(`😵 ${r.n} levou 20 de tranco.`);
        }
        p.used.push(mc.id);
        log(`${r.n} (${p.name}) usou ${at.n}: ${v} em ${or.n} (${o.name})`);
        const fx = {
          seq: ++G.fxSeq,
          by: att,
          tg: tgt,
          ae: r.e,
          te: or.e,
          an: at.n,
          v,
          notes,
          coin: cn,
          ko: null,
        };
        if (oc.dmg >= or.hp) fx.ko = knock(tgt, oc);
        if (mc.dmg >= r.hp && p.cards.includes(mc))
          fx.notes.push(knock(att, mc));
        G.fx = fx;
        if (checkWin()) return;
        if (
          !alive(p) ||
          !actives(p).some((c) => c && !p.used.includes(c.id)) ||
          p.used.length >= SLOTS
        )
          endTurn();
      }
      function autoDef() {
        const pd = G.pend;
        if (!pd) return;
        const t = G.pl[pd.tgt];
        const best = actives(t)
          .map((c, k) => [c ? left(c) : -1, k])
          .sort((a, b) => b[0] - a[0])[0][1];
        G.pend = null;
        resolve(pd.att, pd.s, pd.i, pd.tgt, best, true);
      }
      function autoFill(j) {
        const p = G.pl[j];
        p.act = p.act.map((id) => {
          if (id != null) return id;
          const b = bench(p)[0];
          return b ? b.id : null;
        });
        log(`⏱️ ${p.name} demorou: o jogo escolheu quem entra`);
      }
      // timers do dono: defesa e escolha de substituto não travam a mesa
      function hostTimers() {
        if (!net.host || !G || G.phase !== "battle") return;
        if (G.pend) {
          const k = "def" + G.pend.seq;
          if (!timers[k]) {
            const seq = G.pend.seq,
              ms = isOn(G.pl[G.pend.tgt].mid) ? DEF_MS + 400 : 300;
            timers[k] = setTimeout(() => {
              if (G.pend && G.pend.seq === seq) {
                autoDef();
                broadcast();
              }
            }, ms);
          }
        }
        G.pl.forEach((p, j) => {
          if (!needSlot(j)) return;
          const k = "need" + j + "-" + G.turn + "-" + G.fxSeq;
          if (!timers[k]) {
            const ms = isOn(p.mid) ? NEED_MS : 300;
            timers[k] = setTimeout(() => {
              if (G.phase === "battle" && needSlot(j)) {
                autoFill(j);
                broadcast();
              }
            }, ms);
          }
        });
      }

      function battle(a, from) {
        const p = G.pl[from];
        if (a.t === "pickA") {
          const s = +a.s;
          if (p.act[s] == null && bench(p).some((c) => c.id === a.id)) {
            p.act[s] = a.id;
            log(`${p.name} mandou ${R[cardOf(p, a.id).k].n} pra luta`);
          }
          return;
        }
        if (a.t === "def") {
          const pd = G.pend;
          if (pd && pd.tgt === from && actives(p)[+a.slot]) {
            G.pend = null;
            resolve(pd.att, pd.s, pd.i, pd.tgt, +a.slot, false);
          }
          return;
        }
        if (from !== G.cur || G.pend || anyNeed()) return;
        const myA = actives(p);
        if (a.t === "end") {
          endTurn();
          return;
        }
        if (a.t === "give") {
          const mc = myA[+a.s];
          if (mc && p.eLeft > 0) {
            mc.en++;
            p.eLeft--;
            if (!p.eLeft) log(`${p.name} distribuiu as energias do turno`);
          }
          return;
        }
        if (a.t === "atk") {
          const s = +a.s,
            i = +a.i,
            tg = +a.tgt;
          if (canAtk(p, s, i)) return;
          const o = G.pl[tg];
          if (!o || tg === from || !alive(o)) return;
          const defs = actives(o)
            .map((c, k) => (c ? k : -1))
            .filter((k) => k >= 0);
          if (!defs.length) return;
          if (defs.length === 1) resolve(from, s, i, tg, defs[0], false);
          else {
            G.pend = { seq: ++G.pendSeq, att: from, s, i, tgt: tg, ms: DEF_MS };
            log(`${R[myA[s].k].n} vai atacar ${o.name}!`);
          }
          return;
        }
        if (a.t === "ret") {
          const s = +a.s,
            mc = myA[s],
            tgt = bench(p).find((c) => c.id === a.id);
          if (!mc || !tgt) return;
          const r = R[mc.k];
          if (a.free) {
            if (p.hand[a.hi] !== "swap") return;
            p.hand.splice(a.hi, 1);
          } else {
            if (mc.st.para || mc.st.sleep || p.ret || mc.en < r.r) return;
            mc.en -= r.r;
            p.ret = true;
          }
          clearBad(mc);
          p.act[s] = tgt.id;
          log(`${p.name} trocou ${r.n} por ${R[tgt.k].n}`);
          return;
        }
        if (a.t === "play") {
          const c = p.hand[a.i];
          if (!c) return;
          if (c === "bomb" || c === "mag") {
            const o = G.pl[+a.tj];
            if (!o || +a.tj === from) return;
            const oc = actives(o)[+a.ts];
            if (!oc) return;
            const on = R[oc.k].n;
            if (c === "mag") {
              if (!oc.en) {
                p.toast = "Esse monstrinho não tem energia.";
                return;
              }
              const mc = myA[+a.s];
              if (!mc) return;
              oc.en--;
              mc.en++;
              log(`🧲 ${p.name} puxou 1 energia de ${on} para ${R[mc.k].n}`);
              p.hand.splice(a.i, 1);
              return;
            }
            p.hand.splice(a.i, 1);
            oc.dmg += 20;
            log(`💣 ${p.name} jogou uma Bomba em ${on}`);
            G.fx = {
              seq: ++G.fxSeq,
              by: from,
              tg: +a.tj,
              ae: "💣",
              te: R[oc.k].e,
              an: "Bomba",
              v: 20,
              notes: [],
              coin: null,
              ko: oc.dmg >= R[oc.k].hp ? knock(+a.tj, oc) : null,
            };
            checkWin();
            return;
          }
          const mc = myA[+a.s];
          if (!mc) return;
          const r = R[mc.k];
          if (c === "en" || c === "sup") {
            const add = c === "sup" ? 2 : 1;
            mc.en += add;
            log(
              `${p.name} ligou ${add} energia${add > 1 ? "s" : ""} em ${r.n}`,
            );
          } else if (c === "pot") {
            if (!mc.dmg) {
              p.toast = `${r.n} já está com a vida cheia!`;
              return;
            }
            mc.dmg = Math.max(0, mc.dmg - 30);
            log(`${p.name} usou Poção em ${r.n}`);
          } else if (c === "spot") {
            if (!mc.dmg && !bad(mc)) {
              p.toast = `${r.n} já está 100%!`;
              return;
            }
            mc.dmg = Math.max(0, mc.dmg - 60);
            clearBad(mc);
            log(`${p.name} usou Super Poção em ${r.n}`);
          } else if (c === "wake") {
            if (!bad(mc)) {
              p.toast = `${r.n} não tem nenhuma condição.`;
              return;
            }
            clearBad(mc);
            log(`${p.name} usou Despertador em ${r.n}`);
          } else if (c === "shd") {
            if (mc.st.shield) {
              p.toast = "Já tem escudo.";
              return;
            }
            mc.st.shield = true;
            log(`${r.n} ganhou um escudo 🛡️`);
          } else return;
          p.hand.splice(a.i, 1);
        }
      }

      function apply(a, mid) {
        if (!G || !a) return;
        const host = mid === me.tok;
        if (a.t === "mode") {
          if (host && G.phase === "lobby" && ["ffa", "queue"].includes(a.m))
            G.mode = a.m;
          return broadcast();
        }
        if (a.t === "start") {
          if (host && G.phase === "lobby" && online().length >= 2) newMatch();
          return broadcast();
        }
        if (a.t === "next") {
          if (
            G.phase === "win" &&
            online().length >= 2 &&
            (host || G.mode === "ffa" || nextTwo().includes(mid))
          )
            newMatch();
          return broadcast();
        }
        if (a.t === "kick") {
          if (host && inMatch()) {
            const j = +a.j,
              p = G.pl[j];
            if (p && p.mid !== me.tok) {
              if (G.phase === "battle") {
                p.cards = [];
                p.act = [null, null];
                log(`${p.name} saiu da partida`);
                if (G.pend && (G.pend.tgt === j || G.pend.att === j))
                  G.pend = null;
                if (!checkWin() && G.cur === j) {
                  G.cur = nextAlive(j);
                  G.turn++;
                  startTurn();
                }
              } else {
                G.pl.splice(j, 1);
                if (G.pl.length < 2) G.phase = "lobby";
              }
            }
          }
          return broadcast();
        }
        if (a.t === "skip") {
          if (host && G.phase === "battle") {
            G.pend = null;
            endTurn();
          }
          return broadcast();
        }
        const from = G.pl.findIndex((p) => p.mid === mid);
        if (from < 0) return;
        const p = G.pl[from];
        p.toast = "";
        if (G.phase === "draft") {
          if (a.t === "pick" && !p.ready && R[a.k]) {
            const i = p.picks.indexOf(a.k);
            if (i >= 0) p.picks.splice(i, 1);
            else if (
              R[a.k].lg &&
              p.picks.filter((k) => R[k].lg).length >= MAXLG
            )
              p.toast = `⭐ No máximo ${MAXLG} lendários por time!`;
            else if (p.picks.length < TEAM) p.picks.push(a.k);
          } else if (a.t === "rand" && !p.ready) {
            const sh = [...RK].sort(() => Math.random() - 0.5),
              out = [];
            for (const k of sh) {
              if (out.length === TEAM) break;
              if (R[k].lg && out.filter((x) => R[x].lg).length >= MAXLG)
                continue;
              out.push(k);
            }
            p.picks = out;
          } else if (a.t === "ready" && p.picks.length === TEAM) {
            p.ready = true;
            if (G.pl.every((q) => q.ready)) {
              G.phase = "flip";
              G.first = Math.floor(Math.random() * G.pl.length);
            }
          } else if (a.t === "unready") p.ready = false;
        } else if (G.phase === "flip" && a.t === "begin") {
          G.pl.forEach(build);
          G.cur = G.first;
          G.turn = 1;
          G.log = [];
          G.msgs = [];
          G.fx = null;
          G.pend = null;
          G.gid = Date.now();
          log(`${G.pl[G.cur].name} começa!`);
          startTurn();
          G.phase = "battle";
        } else if (G.phase === "battle" && alive(p)) battle(a, from);
        broadcast();
      }

      // ---------- conexão ----------
      // ---------- conexão (com reconexão automática e retomada após recarregar) ----------
      const SAVE_MS = 3 * 3600e3;
      function saveHost() {
        try {
          localStorage.setItem(
            K("arena-host"),
            JSON.stringify({ code: net.code, G, ts: Date.now() }),
          );
        } catch (e) {}
      }
      function saveGuest() {
        lsSet("arena-guest", { code: net.code, ts: Date.now() });
      }
      function clearSaved() {
        try {
          localStorage.removeItem(K("arena-host"));
          localStorage.removeItem(K("arena-guest"));
        } catch (e) {}
      }
      function broadcast() {
        if (net.host && G) {
          afterWin();
          hostTimers();
          saveHost();
          for (const c of net.conns.keys())
            if (c.open) {
              try {
                c.send({ t: "state", G });
              } catch (e) {}
            }
        }
        render();
      }
      function send(a) {
        if (net.host) apply(a, me.tok);
        else if (net.conn && net.conn.open) net.conn.send({ t: "act", a });
        else {
          L.err = "Sem conexão com a sala. Reconectando…";
          guestRetry(300);
          render();
        }
      }
      function mkCode() {
        return String(Math.floor(1000 + Math.random() * 9000));
      }
      function noPeer() {
        if (window.Peer) return false;
        L.err =
          "Não consegui carregar a parte online. Confira a internet e recarregue a página.";
        render();
        return true;
      }
      const ICE = {
        config: {
          iceServers: [
            { urls: "stun:stun.l.google.com:19302" },
            { urls: "stun:stun1.l.google.com:19302" },
            { urls: "stun:stun.cloudflare.com:3478" },
          ],
        },
      };
      function onPeerErr(e) {
        const t = e && e.type;
        if (net.host && t === "unavailable-id") {
          // ao recarregar, o código antigo demora alguns segundos para ser liberado
          if (net.resuming && net.tries < 15) {
            net.tries++;
            try {
              net.peer.destroy();
            } catch (x) {}
            setTimeout(startHost, 2500);
            render();
            return;
          }
          try {
            net.peer.destroy();
          } catch (x) {}
          net.code = mkCode();
          net.resuming = false;
          startHost();
          return;
        }
        if (!net.host && L.screen === "game") {
          guestRetry(3000);
          return;
        } // sala fora do ar por instantes: tenta de novo
        if (t === "peer-unavailable") {
          L.err =
            "Sala não encontrada. Confira o código e se a sala ainda está aberta.";
          L.screen = "join";
          clearSaved();
        } else if (
          t === "network" ||
          t === "server-error" ||
          t === "socket-error"
        ) {
          L.err = "Problema de internet. Tentando de novo…";
          if (net.host)
            setTimeout(() => {
              try {
                net.peer.reconnect();
              } catch (x) {}
            }, 3000);
        } else if (t === "browser-incompatible")
          L.err = "Este navegador não suporta o modo online. Tente o Chrome.";
        else L.err = "Erro de conexão (" + (t || "?") + ").";
        render();
      }
      function startHost() {
        if (noPeer()) return;
        net.peer = new Peer(PFX + net.code, { debug: 0, ...ICE });
        net.peer.on("open", () => {
          net.resuming = false;
          net.tries = 0;
          L.err = "";
          render();
        });
        net.peer.on("connection", (c) => {
          net.seen.set(c, Date.now());
          c.on("data", (m) => {
            net.seen.set(c, Date.now());
            hostMsg(c, m);
          });
          c.on("close", () => hostClose(c));
          c.on("error", () => {});
        });
        net.peer.on("error", onPeerErr);
        net.peer.on("disconnected", () => {
          setTimeout(() => {
            try {
              if (net.peer && !net.peer.destroyed && net.peer.disconnected)
                net.peer.reconnect();
            } catch (e) {}
          }, 1000);
        });
      }
      net.seen = new Map();
      function createRoom() {
        net.host = true;
        net.code = mkCode();
        net.resuming = false;
        G = newRoom();
        L.seenFx = 0;
        L.err = "";
        L.connected = true;
        L.screen = "game";
        saveHost();
        render();
        startHost();
      }
      function resumeHost(sv) {
        net.host = true;
        net.code = sv.code;
        net.resuming = true;
        net.tries = 0;
        G = sv.G;
        G.members.forEach((m) => {
          m.on = m.mid === me.tok;
        });
        const mm = member(me.tok);
        if (mm) {
          mm.name = me.name || mm.name;
        }
        L.seenFx = G.fx ? G.fx.seq : 0;
        L.connected = true;
        L.screen = "game";
        log("🔄 A sala foi reaberta");
        render();
        startHost();
      }
      function hostMsg(c, m) {
        if (!m || typeof m !== "object" || !G) return;
        if (m.t === "pong") return;
        if (m.t === "hello") {
          const tok = String(m.tok || "").slice(0, 12),
            av = AV.includes(m.av) ? m.av : "🧒";
          const nm =
            String(m.name || "Amigo")
              .trim()
              .slice(0, 16) || "Amigo";
          if (!tok) return;
          let mb = member(tok);
          if (!mb) {
            if (G.members.length >= MAXP) {
              try {
                c.send({ t: "full" });
              } catch (e) {}
              setTimeout(() => c.close(), 500);
              return;
            }
            let n2 = nm,
              i = 2;
            while (G.members.some((x) => x.name === n2)) n2 = nm + " " + i++;
            mb = { mid: tok, name: n2, av, on: true };
            G.members.push(mb);
            G.order.push(tok);
            log(`${mb.av} ${mb.name} entrou na sala`);
          } else {
            if (!mb.on) log(`${mb.name} voltou`);
            mb.on = true;
            mb.av = av;
          }
          for (const [cc, id] of net.conns)
            if (id === tok && cc !== c) {
              net.conns.delete(cc);
              try {
                cc.close();
              } catch (e) {}
            }
          net.conns.set(c, tok);
          broadcast();
        } else if (m.t === "act") {
          const mid = net.conns.get(c);
          if (mid) apply(m.a, mid);
        } else if (m.t === "react") {
          const mid = net.conns.get(c),
            mb = mid && member(mid);
          if (mb && REACT.includes(m.e)) relayReact(m.e, mb.av + " " + mb.name);
        }
      }
      // quem cai continua na sala (marcado como "caiu") e volta para o mesmo lugar ao reconectar
      function hostClose(c) {
        const mid = net.conns.get(c);
        net.conns.delete(c);
        net.seen.delete(c);
        if (!mid || !G) return;
        const mb = member(mid);
        if (!mb) return;
        for (const id of net.conns.values()) if (id === mid) return;
        if (mb.on) {
          mb.on = false;
          log(`📡 ${mb.name} caiu`);
        }
        broadcast();
      }
      function joinRoom(code, quiet) {
        net.host = false;
        net.code = code;
        L.err = "";
        if (!quiet) {
          L.screen = "joining";
          render();
        }
        if (noPeer()) return;
        if (!net.peer || net.peer.destroyed) {
          net.peer = new Peer({ debug: 0, ...ICE });
          net.peer.on("open", connectTo);
          net.peer.on("error", onPeerErr);
          net.peer.on("disconnected", () => {
            setTimeout(() => {
              try {
                if (net.peer && !net.peer.destroyed && net.peer.disconnected)
                  net.peer.reconnect();
              } catch (e) {}
            }, 1000);
          });
        } else if (net.peer.disconnected) {
          try {
            net.peer.reconnect();
          } catch (e) {}
          setTimeout(connectTo, 1200);
        } else connectTo();
      }
      function connectTo() {
        if (!net.peer || net.peer.destroyed || net.leaving) return;
        try {
          if (net.conn) net.conn.close();
        } catch (e) {}
        const c = net.peer.connect(PFX + net.code, { reliable: true });
        net.conn = c;
        c.on("open", () => {
          L.connected = true;
          L.err = "";
          net.lastMsg = Date.now();
          net.retries = 0;
          c.send({ t: "hello", name: me.name, av: me.av, tok: me.tok });
          render();
        });
        c.on("data", (m) => {
          net.lastMsg = Date.now();
          if (!m || typeof m !== "object") return;
          if (m.t === "ping") {
            try {
              c.send({ t: "pong" });
            } catch (e) {}
            return;
          }
          if (m.t === "state") {
            G = m.G;
            if (L.seenFx === null) L.seenFx = G.fx ? G.fx.seq : 0;
            L.screen = "game";
            saveGuest();
            render();
          } else if (m.t === "react") showReact(m.e, m.by);
          else if (m.t === "full") {
            L.err = `Essa sala está cheia (máximo ${MAXP}).`;
            L.screen = "join";
            clearSaved();
            render();
          }
        });
        c.on("close", () => {
          if (net.conn === c) {
            L.connected = false;
            net.conn = null;
            render();
            guestRetry(1500);
          }
        });
        c.on("error", () => {});
        setTimeout(() => {
          if (net.conn === c && !c.open) {
            if (L.screen === "joining" && !G) {
              L.err =
                "Não consegui conectar. Confira o código e tente de novo. Se estiverem no 4G, tentem no Wi-Fi.";
              L.screen = "join";
              render();
            } else guestRetry(2000);
          }
        }, 12000);
      }
      // reconexão automática do convidado, com espera crescente
      function guestRetry(ms) {
        if (net.host || net.leaving || !net.code || net.retryT) return;
        net.retries = (net.retries || 0) + 1;
        const wait = Math.min(ms * Math.max(1, net.retries / 2), 8000);
        net.retryT = setTimeout(() => {
          net.retryT = null;
          if (!L.connected && !net.leaving) joinRoom(net.code, true);
        }, wait);
      }
      function leave() {
        net.leaving = true;
        clearSaved();
        clearTimeout(net.retryT);
        net.retryT = null;
        try {
          net.conn && net.conn.close();
        } catch (e) {}
        for (const c of net.conns.keys()) {
          try {
            c.close();
          } catch (e) {}

<div class=spin>${G.pl.map((q, j) => `<span class="sp ${j === G.first ? "win" : ""}">${q.av}</span>`).join("")}</div>
<div class="reveal big" style="font-size:30px">${f.av} ${esc(f.name)} começa!</div>
<div class=reveal>${G.pl.map((q) => `<div class=qi><span class=av>${q.av}</span><span class=f>${esc(q.name)}</span><span>${q.picks.map((k) => R[k].e).join(" ")}</span></div>`).join("")}</div>
${mi >= 0 ? '<button class="btn reveal" data-a=begin>Começar a batalha ⚔️</button>' : '<div class="msg reveal" style="text-align:center">Esperando os jogadores começarem…</div>'}`;
      }

      function vWin() {
        const w = G.pl[G.winner],
          mi = myIdx_(),
          iWon = G.winner === mi,
          ffa = G.mode === "ffa",
          nx = nextTwo().map(member);
        const canNext =
            net.host || ffa || nx.some((m) => m && m.mid === me.tok),
          n = online().length;
        return `${connBar()}<div style="text-align:center;margin-top:30px"><div class="big pop" style="font-size:96px">${iWon ? "🏆" : mi >= 0 ? "💪" : "🎉"}</div>
  <h1 class=pop>${iWon ? "Você venceu!" : esc(w.av + " " + w.name) + " venceu!"}</h1><div class="big pop" style="font-size:40px">${w.cards.map((c) => R[c.k].e).join(" ")}</div>
  <p>${mi >= 0 && !iWon ? "Quando não vence, aprende! Bora de novo?" : ""}</p></div>
  ${
    n < 2
      ? '<div class=msg style="text-align:center">⏳ Esperando mais alguém para a próxima…</div>'
      : ffa
        ? `<div class=msg style="text-align:center">🌀 Próxima: todo mundo da sala (${n} jogadores)</div>${canNext ? "<button class=btn data-a=next>Nova partida ▶️</button>" : ""}`
        : `<div class=msg style="text-align:center;font-size:18px">⏭️ Próxima: <b>${nx[0].av} ${esc(nx[0].name)}</b> x <b>${nx[1].av} ${esc(nx[1].name)}</b></div>${canNext ? "<button class=btn data-a=next>Começar próxima partida ▶️</button>" : '<div class=msg style="text-align:center">Esperando a próxima dupla começar…</div>'}`
  }
  ${queueBox()}${reactBar()}
  <div class=grid2><button class="btn sec sm" data-a=rank>🏆 Ranking</button><button class="btn sec sm" data-a=leave>🚪 Sair da sala</button></div>`;
      }

      function vModal() {
        const mi = G ? myIdx_() : -1,
          p = mi >= 0 ? G.pl[mi] : null;
        // 1) defesa: eu fui atacado e tenho 2 em campo
        if (G && G.phase === "battle" && G.pend && G.pend.tgt === mi) {
          const pd = G.pend,
            ap = G.pl[pd.att],
            ac = actives(ap)[pd.s],
            at = R[ac.k].a[pd.i];
          return `<div class=ov><div class="md defend"><div class=big style="font-size:44px">🛡️</div><h2 style="text-align:center">${ap.av} ${esc(ap.name)} vai te atacar!</h2>
    <p style="text-align:center">${R[ac.k].e} <b>${R[ac.k].n}</b> usa <b>${at.n}</b> (${at.d} de dano${at.fx ? ", " + FX[at.fx] : ""})</p>
    <p style="text-align:center"><b>Quem vai defender?</b> <span class=cd></span></p>
    <div class=mine>${actives(p)
      .map((c, s) =>
        c
          ? `<button class=defb data-a=def data-s=${s}>${monCard(c, true)}<span class=prev>vai levar ~${preview(pd.att, pd.s, pd.i, mi, s)}</span></button>`
          : "",
      )
      .join("")}</div></div></div>`;
        }
        // 2) preciso colocar alguém no lugar de quem desmaiou
        if (G && G.phase === "battle" && mi >= 0 && needSlot(mi)) {
          const s = p.act.findIndex((x) => x == null);
          return `<div class=ov><div class=md><h2>Quem entra na luta?</h2><p class=small>Um dos seus monstrinhos desmaiou. Escolha quem entra no lugar. <span class=cd2></span></p>${bench(
            p,
          )
            .map(
              (c) =>
                `<button class=atk data-a=pickA data-s=${s} data-id=${c.id}><span>${R[c.k].e} ${R[c.k].n} ${T[R[c.k].t][0]}</span><span class=small>❤️ ${left(c)}/${R[c.k].hp}</span></button>`,
            )
            .join("")}</div></div>`;
        }
        // 3) animação do ataque
        if (L.fxShow && G) {
          const m = L.fxShow;
          return `<div class=ov><div class=md><div class=fight><span class=lunge>${m.ae}</span><span class="${m.ko ? "hit ko" : "hit"}">${m.te}</span></div>
    <div style="text-align:center;font-weight:700;font-size:19px">${esc(G.pl[m.by] ? G.pl[m.by].name : "")} ➜ ${esc(G.pl[m.tg] ? G.pl[m.tg].name : "")}: ${esc(m.an)}!</div>
    ${m.coin != null ? `<div class=coin style="width:90px;height:90px;font-size:16px">${m.coin ? "CARA" : "COROA"}</div>` : ""}
    <div class="big dmg">−${m.v}</div>
    <div class=reveal>${m.notes.map((n) => `<div class=msg>${esc(n)}</div>`).join("")}${m.ko ? `<div class=msg style="font-size:18px">${esc(m.ko)}</div>` : ""}</div>
    <button class="btn reveal" data-a=fxClose>Continuar</button></div></div>`;
        }
        const m = L.modal;
        if (!m) return "";
        let h = "";
        const opps = () =>
          G.pl.map((q, j) => j).filter((j) => j !== mi && alive(G.pl[j]));
        if (m.k === "card") {
          const c = p && p.hand[m.i];
          if (!c) {
            L.modal = null;
            return "";
          }
          let opts = "";
          if (c === "bomb" || c === "mag") {
            opts =
              (c === "mag"
                ? "<p class=small>Escolha de quem puxar a energia (vai para o seu monstrinho escolhido abaixo):</p>"
                : "<p class=small>Em quem jogar a bomba?</p>") +
              opps()
                .map(
                  (j) =>
                    `<div class=lbl>${G.pl[j].av} ${esc(G.pl[j].name)}</div>` +
                    actives(G.pl[j])
                      .map((oc, ts) =>
                        oc
                          ? `<button class=atk data-a=pickT data-tj=${j} data-ts=${ts} ${c === "mag" && !oc.en ? "disabled" : ""}><span>${R[oc.k].e} ${R[oc.k].n}</span><span class=small>❤️ ${left(oc)} · 🟡${oc.en}</span></button>`
                          : "",
                      )
                      .join(""),
                )
                .join("");
          } else if (c === "swap")
            opts =
              "<p class=small>Qual dos seus monstrinhos sai da luta?</p>" +
              actives(p)
                .map((mc, s) =>
                  mc
                    ? `<button class=atk data-a=swapOut data-s=${s}><span>${R[mc.k].e} ${R[mc.k].n}</span><span class=small>❤️ ${left(mc)}</span></button>`
                    : "",
                )
                .join("");
          else
            opts =
              "<p class=small>Em qual monstrinho usar?</p>" +
              actives(p)
                .map((mc, s) =>
                  mc
                    ? `<button class=atk data-a=playOn data-s=${s}><span>${R[mc.k].e} ${R[mc.k].n}</span><span class=small>❤️ ${left(mc)}/${R[mc.k].hp} · 🟡${mc.en}</span></button>`
                    : "",
                )
                .join("");
          h = `<div class=big>${H[c][0]}</div><h2 style="text-align:center">${H[c][1]}</h2><p style="text-align:center">${HD[c]}</p>${opts}<button class="btn sec sm" data-a=close>Guardar</button>`;
        } else if (m.k === "magTo")
          h =
            `<h2>🧲 Para qual monstrinho seu?</h2>` +
            actives(p)
              .map((mc, s) =>
                mc
                  ? `<button class=atk data-a=magTo data-s=${s}><span>${R[mc.k].e} ${R[mc.k].n}</span><span class=small>🟡${mc.en}</span></button>`
                  : "",
              )
              .join("") +
            '<button class="btn sec sm" data-a=close>Cancelar</button>';
        else if (m.k === "swapIn")
          h =
            `<h2>🔄 Quem entra?</h2>` +
            bench(p)
              .map(
                (c) =>
                  `<button class=atk data-a=swapIn data-id=${c.id}><span>${R[c.k].e} ${R[c.k].n}</span><span class=small>❤️ ${left(c)}/${R[c.k].hp}</span></button>`,
              )
              .join("") +
            '<button class="btn sec sm" data-a=close>Cancelar</button>';
        else if (m.k === "retreat") {
          const c = cardOf(p, m.id);
          if (!c) {
            L.modal = null;
            return "";
          }
          h =
            `<h2>Colocar ${R[c.k].e} ${R[c.k].n} na luta</h2><p class=small>Quem sai? Recuar custa as energias do recuo e só pode 1 vez por turno.</p>` +
            actives(p)
              .map((mc, s) => {
                if (!mc) return "";
                const r = R[mc.k];
                const b =
                  mc.st.para || mc.st.sleep
                    ? "dormindo/paralisado"
                    : p.ret
                      ? "já recuou neste turno"
                      : mc.en < r.r
                        ? `precisa de ${r.r} energia`
                        : "";
                return `<button class=atk data-a=doRet data-s=${s} ${b ? "disabled" : ""}><span>${r.e} ${r.n}<br><span class=small>${b || "custo: " + ("🟡".repeat(r.r) || "grátis")}</span></span><span class=small>❤️ ${left(mc)}</span></button>`;
              })
              .join("") +
            '<button class="btn sec sm" data-a=close>Cancelar</button>';
        } else if (m.k === "target") {
          const c = actives(p)[m.s],
            at = R[c.k].a[m.i];
          h =
            `<h2>${R[c.k].e} ${at.n}: atacar quem?</h2><p class=small>Quem você escolher decide qual monstrinho defende.</p>` +
            opps()
              .map((j) => {
                const o = G.pl[j];
                return `<button class=tgtb data-a=atkTo data-j=${j}><div class=oh><span>${o.av} <b>${esc(o.name)}</b></span><span class=small>🐾 ${o.cards.length}</span></div><div class=pair>${actives(
                  o,
                )
                  .map((oc) =>
                    monCard(
                      oc,
                      false,
                      oc && W[R[oc.k].t] === R[c.k].t ? "weak" : "",
                    ),
                  )
                  .join("")}</div></button>`;
              })
              .join("") +
            '<button class="btn sec sm" data-a=close>Cancelar</button>';
        } else if (m.k === "menu")
          h = `<h2>Menu</h2><p class=small>Sala ${esc(net.code)} · ${L.connected ? "🟢 conectado" : "🔴 sem conexão"}</p>${shareBox()}${help()}<button class="btn sec" data-a=rank>🏆 Ranking</button><button class="btn red" data-a=leave>🚪 Sair da sala</button><button class=btn data-a=close>Voltar pro jogo</button>`;
        else if (m.k === "resetRank")
          h = `<h2>Zerar o ranking?</h2><p>Todas as vitórias e derrotas deste celular voltam para zero.</p><button class="btn red" data-a=doReset>Zerar</button><button class="btn sec sm" data-a=close>Cancelar</button>`;
        return `<div class=ov><div class=md>${h}</div></div>`;
      }

      function render() {
        const inGame = L.screen === "game" && G;
        if (inGame) {
          if (G.phase === "win") recordWin();
          if (G.fx && L.seenFx !== null && G.fx.seq > L.seenFx) {
            L.seenFx = G.fx.seq;
            L.fxShow = G.fx;
            L.modal = null;
            sfx("hit");
            buzz(150);
            if (G.fx.ko) setTimeout(() => sfx("ko"), 500);
          }
          const mi = myIdx_();
          if (G.pend && G.pend.seq !== L.pendSeq) {
            L.pendSeq = G.pend.seq;
            L.pendUntil = Date.now() + G.pend.ms;
            if (G.pend.tgt === mi) {
              L.modal = null;
              L.fxShow = null;
              buzz([200, 80, 200]);
              sfx("ko");
            }
          }
          const k =
            G.phase === "battle" && mi >= 0 && G.cur === mi
              ? G.gid + "-" + G.turn
              : null;
          if (k && k !== L.turnKey) {
            L.turnKey = k;
            buzz([60, 40, 60]);
            setTimeout(() => sfx("en"), L.fxShow ? 900 : 0);
          }
        }
        let h;
        if (inGame)
          h = {
            lobby: vRoom,
            draft: vDraft,
            flip: vFlip,
            battle: vBattle,
            win: vWin,
          }[G.phase]();
        else
          h = { home: vHome, join: vJoin, joining: vJoining, rank: vRank }[
            L.screen === "game" ? "home" : L.screen
          ]();
        const wide = inGame && ["battle", "draft"].includes(G.phase);
        app.innerHTML =
          (wide ? h : `<div class=narrow>${h}</div>`) +
          (inGame || L.modal ? vModal() : "");
        tick();
      }
      // contagem regressiva da defesa
      function tick() {
        const left = Math.max(
          0,
          Math.ceil(((L.pendUntil || 0) - Date.now()) / 1000),
        );
        document
          .querySelectorAll(".cd")
          .forEach((e) => (e.textContent = G && G.pend ? `(${left}s)` : ""));
      }
      setInterval(tick, 500);

      // ---------- ações da tela ----------
      function needName() {
        const el = $("myname");
        if (el) {
          me.name = el.value.trim().slice(0, 16);
          lsSet("arena-on-me", me);
        }
        if (!me.name) {
          L.err = "Escreva seu nome primeiro.";
          render();
          return true;
        }
        return false;
      }
      const A = {
        avSel: (d) => {
          me.av = d.v;
          lsSet("arena-on-me", me);
          document
            .querySelectorAll(".avb")
            .forEach((b) => b.classList.toggle("on", b.dataset.v === d.v));
        },
        create: () => {
          if (needName()) return;
          createRoom();
        },
        toJoin: () => {
          const el = $("myname");
          if (el) {
            me.name = el.value.trim().slice(0, 16);
            lsSet("arena-on-me", me);
          }
          L.err = "";
          L.screen = "join";
          render();
        },
        doJoin: () => {
          const code = ($("jc") || {}).value || "";
          L.joinCode = code.trim();
          if (needName()) return;
          if (!/^\d{4}$/.test(L.joinCode)) {
            L.err = "O código tem 4 números.";
            render();
            return;
          }
          joinRoom(L.joinCode);
        },
        home: () => {
          L.err = "";
          L.screen = "home";
          render();
        },
        copy: () => {
          try {
            navigator.clipboard
              .writeText(roomLink())
              .then(() => {
                document
                  .querySelectorAll("[data-a=copy]")
                  .forEach((b) => (b.textContent = "✅ Copiado!"));
              })
              .catch(() => {});
          } catch (e) {}
        },
        leave: () => leave(),
        reconnect: () => {
          clearTimeout(net.retryT);
          net.retryT = null;
          joinRoom(net.code, true);
        },
        mode: (d) => send({ t: "mode", m: d.m }),
        start: () => send({ t: "start" }),
        next: () => send({ t: "next" }),
        kick: (d) => send({ t: "kick", j: +d.j }),
        skip: () => send({ t: "skip" }),
        react: (d) => sendReact(d.e),
        flt: (d) => {
          L.flt = d.t;
          render();
        },
        pk: (d) => {
          sfx();
          send({ t: "pick", k: d.k });
        },
        rand: () => {
          sfx();
          send({ t: "rand" });
        },
        ready: () => send({ t: "ready" }),
        unready: () => send({ t: "unready" }),
        begin: () => send({ t: "begin" }),
        use: (d) => {
          L.modal = { k: "card", i: +d.i };
          render();
        },
        playOn: (d) => {
          const i = L.modal.i;
          L.modal = null;
          sfx("en");
          send({ t: "play", i, s: +d.s });
        },
        pickT: (d) => {
          const i = L.modal.i,
            c = G.pl[myIdx_()].hand[i];
          if (c === "mag") {
            L.modal = { k: "magTo", i, tj: +d.tj, ts: +d.ts };
            render();
            return;
          }
          L.modal = null;
          sfx("hit");
          send({ t: "play", i, tj: +d.tj, ts: +d.ts });
        },
        magTo: (d) => {
          const m = L.modal;
          L.modal = null;
          sfx("en");
          send({ t: "play", i: m.i, tj: m.tj, ts: m.ts, s: +d.s });
        },
        swapOut: (d) => {
          L.modal = { k: "swapIn", i: L.modal.i, s: +d.s };
          render();
        },
        swapIn: (d) => {
          const m = L.modal;
          L.modal = null;
          sfx();
          send({ t: "ret", s: m.s, id: +d.id, free: true, hi: m.i });
        },
        retreat: (d) => {
          L.modal = { k: "retreat", id: +d.id };
          render();
        },
        doRet: (d) => {
          const m = L.modal;
          L.modal = null;
          sfx();
          send({ t: "ret", s: +d.s, id: m.id });
        },
        atk: (d) => {
          const mi = myIdx_(),
            opps = G.pl
              .map((q, j) => j)
              .filter((j) => j !== mi && alive(G.pl[j]));
          if (opps.length === 1) {
            send({ t: "atk", s: +d.s, i: +d.i, tgt: opps[0] });
            return;
          }
          L.modal = { k: "target", s: +d.s, i: +d.i };
          render();
        },
        atkTo: (d) => {
          const m = L.modal;
          L.modal = null;
          send({ t: "atk", s: m.s, i: m.i, tgt: +d.j });
        },
        def: (d) => {
          sfx();
          send({ t: "def", slot: +d.s });
        },
        end: () => send({ t: "end" }),
        install: () => {
          if (!installEvt) return;
          installEvt.prompt();
          installEvt.userChoice.finally(() => {
            installEvt = null;
            render();
          });
        },
        give: (d) => {
          sfx("en");
          buzz(30);
          send({ t: "give", s: +d.s });
        },
        pickA: (d) => {
          sfx();
          send({ t: "pickA", s: +d.s, id: +d.id });
        },
        fxClose: () => {
          L.fxShow = null;
          render();
        },
        menu: () => {
          L.modal = { k: "menu" };
          render();
        },
        close: () => {
          L.modal = null;
          render();
        },
        rank: () => {
          L.modal = null;
          L.prev = L.screen;
          L.screen = "rank";
          render();
        },
        back: () => {
          L.screen = L.prev && L.prev !== "rank" ? L.prev : "home";
          render();
        },
        resetRank: () => {
          L.modal = { k: "resetRank" };
          render();
        },
        doReset: () => {
          RANK = { ps: {}, gids: RANK.gids };
          lsSet("arena-on-rank", RANK);
          L.modal = null;
          render();
        },
      };
      const NEEDM = [
        "playOn",
        "pickT",
        "magTo",
        "swapOut",
        "swapIn",
        "doRet",
        "atkTo",
      ];
      app.addEventListener("click", (e) => {
        const el = e.target.closest("[data-a]");
        if (!el || el.disabled) return;
        const k = el.dataset.a,
          f = A[k];
        if (!f) return;
        if (NEEDM.includes(k) && !L.modal) {
          render();
          return;
        } // toque duplo em janela que já fechou
        f(el.dataset);
        if (NEEDM.includes(k) && !L.modal) render();
      });
      app.addEventListener("input", (e) => {
        if (e.target.id === "myname") {
          me.name = e.target.value.trim().slice(0, 16);
          lsSet("arena-on-me", me);
        }
      });
      // voltou depois de atualizar a página? retoma a sala
      (function resume() {
        const hs = ls("arena-host", null),
          gs = ls("arena-guest", null),
          now = Date.now();
        if (
          hs &&
          hs.G &&
          now - hs.ts < SAVE_MS &&
          !(L.joinCode && L.joinCode !== hs.code)
        ) {
          resumeHost(hs);
          return;
        }
        if (
          me.name &&
          gs &&
          now - gs.ts < SAVE_MS &&
          (!L.joinCode || L.joinCode === gs.code)
        ) {
          joinRoom(gs.code);
          return;
        }
        render();
      })();

      if (
        ("serviceWorker" in navigator && location.protocol === "https:") ||
        location.hostname === "localhost"
      )
        navigator.serviceWorker &&
          navigator.serviceWorker.register("sw.js").catch(() => {});
    </script>
  </body>
</html>
